[project]
name = "aion2-api"
version = "1.0.0"
description = "Unofficial JSON API for AION 2 (Global): notices, in-game events and live server population."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "aion2",
    "aion",
    "ncsoft",
    "mmorpg",
    "api",
    "fastapi",
    "server-status",
    "web-scraping",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    # Python 3.9 resolves starlette 0.49, which imports httpx; 3.10+ resolves
    # starlette 1.7, which prefers httpx2. Without this the route tests cannot
    # run on the declared minimum Python.
    "httpx>=0.28; python_full_version < '3.10'",
]

# No [build-system] on purpose: this is an application, not a distributable
# package, so `uv sync` installs the dependencies and leaves the source in place.
