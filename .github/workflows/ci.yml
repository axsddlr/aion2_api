name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from the committed lockfile (uv sync --locked)
        run: uv sync --locked

      - name: Run client and CLI test suite (test_aion2.py)
        run: uv run python test_aion2.py

      - name: Run FastAPI service test suite (test_app.py)
        run: uv run python test_app.py

  lockfile:
    name: Lockfile in sync (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Verify uv.lock is up to date (uv lock --check)
        run: uv lock --check
