name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Pinned: uv.lock was produced by this version, and a future uv could
          # reject a lock it now considers stale on an untouched tree.
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from the committed lockfile (uv sync --locked)
        run: uv sync --locked

      - name: Run client and CLI test suite (test_aion2.py)
        run: uv run python test_aion2.py

      - name: Run FastAPI service test suite (test_app.py)
        run: uv run python test_app.py

  lockfile:
    name: Lockfile in sync (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.13"

      - name: Verify uv.lock is up to date (uv lock --check)
        run: uv lock --check

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the runtime image
        run: docker build -t aion2-api:ci .

      - name: Validate the compose file still parses
        run: docker compose config -q

      - name: Start the container
        run: docker run -d --name aion2-ci -p 8000:8000 aion2-api:ci

      - name: Check it actually serves, and is not root
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "up after ${i} tries"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/openapi.json | grep -q '/servers/roster'
          test "$(docker run --rm aion2-api:ci id -u)" != "0"
          echo "image serves OpenAPI and runs non-root"

      - name: Show the size and stop the container
        if: always()
        run: |
          docker image ls aion2-api:ci
          docker rm -f aion2-ci || true
          docker logs aion2-ci 2>/dev/null | tail -n 20 || true
